<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Galeria Flask{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 8px; }
    .msg { padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
    .msg.ok { background: #e6f4ea; color: #1e6b34; }
    .msg.erro { background: #fdecea; color: #a12622; }
    form.upload { display: flex; gap: 10px; align-items: center; padding: 16px; border: 1px dashed #bbb; border-radius: 8px; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #222; color: #fff; cursor: pointer; }
    button.perigo { background: #c0392b; }
    .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
    .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card form { padding: 8px; text-align: center; }
    a { color: #222; }
  </style>
</head>
<body>
  {% with mensagens = get_flashed_messages(with_categories=true) %}
    {% for categoria, m in mensagens %}<p class="msg {{ categoria }}">{{ m }}</p>{% endfor %}
  {% endwith %}
  {% block conteudo %}{% endblock %}
</body>
</html>
